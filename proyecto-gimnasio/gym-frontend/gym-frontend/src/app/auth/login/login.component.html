<div class="login-screen">
  <div class="login-brand">
    <div class="login-brand-mark">G</div>
    <h1>Gimnasio<br>CIBERTEC</h1>
    <p>Panel de administración de socios y membresías.</p>

    <div class="login-rings" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-form-wrap">
      <h2>Iniciar sesión</h2>
      <p class="login-subtitle">Ingresa con tu cuenta de administrador.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" type="text" formControlName="username" placeholder="admin" autocomplete="username">
          <div class="field-error" *ngIf="form.get('username')?.touched && form.get('username')?.invalid">
            El usuario es obligatorio
          </div>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="••••••••" autocomplete="current-password">
          <div class="field-error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">
            La contraseña es obligatoria
          </div>
        </div>

        <div class="form-banner-error" *ngIf="errorMsg">{{ errorMsg }}</div>

        <button type="submit" class="btn-primary btn-block" [disabled]="cargando">
          {{ cargando ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <p class="login-hint">Usuario de prueba: admin / admin123</p>
    </div>
  </div>
</div>
